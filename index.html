<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>図解→PowerPoint 変換ツール</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>図解→PowerPoint 変換ツール</h1>
      <p class="lead">画像のような説明図を、ブラウザ上で編集して .pptx として出力できます。</p>

      <section class="editor">
        <label>タイトル <input id="title" value="取引状況が決まる仕組み" /></label>
        <label>サブタイトル <input id="subtitle" value="大元は「FO得意先一覧」" /></label>

        <h2>判定ステップ</h2>
        <div id="steps"></div>
        <button id="add-step" type="button">ステップ追加</button>
      </section>

      <section class="actions">
        <button id="download" type="button">PowerPointをダウンロード</button>
      </section>

      <section class="preview-wrap">
        <h2>プレビュー</h2>
        <svg id="preview" viewBox="0 0 1280 720" role="img" aria-label="プレビュー図"></svg>
      </section>
    </main>

    <template id="step-template">
      <div class="step-row">
        <input class="step-title" placeholder="見出し" />
        <input class="step-condition" placeholder="条件" />
        <input class="step-result" placeholder="結果" />
        <input class="step-color" type="color" value="#2f6fdf" />
        <button class="remove" type="button">削除</button>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
